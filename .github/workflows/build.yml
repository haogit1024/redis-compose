name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the old run, but never cancel a
# release build that is already packaging artifacts for a tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Code Style Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code style
        run: ./gradlew ktlintCheck

  build:
    name: Build (${{ matrix.os }})
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            glob: "**/*.dmg"
            artifact: redis-compose-macos-arm64
            dmgSuffix: "-arm64"
          # macos-latest is Apple Silicon; Intel Macs need their own x64 build.
          - os: macos-15-intel
            task: packageDmg
            glob: "**/*.dmg"
            artifact: redis-compose-macos-x64
            dmgSuffix: "-x64"
          - os: ubuntu-latest
            task: packageDeb
            glob: "**/*.deb"
            artifact: redis-compose-linux-x64
          - os: windows-latest
            task: packageMsi
            glob: "**/*.msi"
            artifact: redis-compose-windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      # Installers are only produced for tags and manual runs. Pull requests and
      # regular main pushes still validate compilation and tests on every runner.
      - name: Package native distribution
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ./gradlew :desktopApp:${{ matrix.task }}

      # Both macOS runners produce RedisCompose-1.0.0.dmg, so tag them by CPU
      # before uploading; otherwise the release would keep only one architecture.
      - name: Rename macOS DMG by architecture
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          for file in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            mv "$file" "${file%.dmg}${{ matrix.dmgSuffix }}.dmg"
          done

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktopApp/build/compose/binaries/main/${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags such as v0.2.0-beta.1 become GitHub pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
